name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and deploy portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Smoke tests
        run: node --test tests/rendered-html.test.mjs

      - name: Build
        run: npm run build

      - name: Validate Cloudflare deployment artifact
        run: npm run deploy:cloudflare:dry-run

      - name: Deploy to Cloudflare
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -n "${CLOUDFLARE_DEPLOY_HOOK:-}" ]; then
            curl --fail --silent --show-error --request POST "${CLOUDFLARE_DEPLOY_HOOK}"
            echo "Triggered Cloudflare Pages deployment for https://ahmedsalman.pages.dev." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Add CLOUDFLARE_DEPLOY_HOOK, or add both CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, to this repository's GitHub Actions secrets."
            exit 1
          fi

          npm run deploy:cloudflare
          echo "Deployed Cloudflare Worker runtime for https://ahmedsalman.pages.dev." >> "$GITHUB_STEP_SUMMARY"
